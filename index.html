<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b4d">
<title>Conferência de Caixas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8f6;font-family:Arial,sans-serif}
#appFrame{display:block;width:100%;height:100%;border:0}
#syncNotice{position:fixed;z-index:10;right:12px;bottom:12px;padding:8px 12px;border-radius:8px;background:#123f30;color:#fff;font-size:12px;box-shadow:0 4px 18px #0002;opacity:0;transition:opacity .2s;pointer-events:none}
#syncNotice.show{opacity:1}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<iframe id="appFrame" src="app-original.html" title="Conferência de Caixas"></iframe>
<div id="syncNotice" role="status" aria-live="polite"></div>
<script>
(() => {
  const CONFIG = {
    apiKey: 'AIzaSyAsJ9TYMkwm_Fzac8-XAP2LPRYmlPmXt8s',
    authDomain: 'inventarioconsolidadosetarq.firebaseapp.com',
    projectId: 'inventarioconsolidadosetarq',
    storageBucket: 'inventarioconsolidadosetarq.firebasestorage.app',
    messagingSenderId: '491962222032',
    appId: '1:491962222032:web:216cc560776a1fc2bbe5d5',
    measurementId: 'G-NMPEYYBJ12'
  };
  const KEY = 'conferencia_caixas_status_v1';
  const COLLECTION = 'conferencia_status';
  const frame = document.getElementById('appFrame');
  const notice = document.getElementById('syncNotice');
  let db, ready = false, firstSnapshot = false, frameLoaded = false;
  let frameStorageSetItem = null;
  let applyingRemote = false;
  let lastKnownMap = {};
  let returnToStatusAfterSave = false;
  let savedStatusView = null;
  const pendingWrites = new Set();
  const cloudDocId = id => encodeURIComponent(String(id));
  const readMap = () => {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
    catch (_) { return {}; }
  };
  const stateValue = s => ({
    status: s && s.status || 'pendente',
    note: s && s.note || '',
    checkedAt: s && s.checkedAt || '',
    checkedBy: s && s.checkedBy || ''
  });
  const stable = map => Object.fromEntries(Object.keys(map || {}).sort().map(k => [k, stateValue(map[k])]));
  const same = (a,b) => JSON.stringify(stable(a)) === JSON.stringify(stable(b));
  const meaningful = s => !!s && ((s.status && s.status !== 'pendente') || s.note || s.checkedAt || s.checkedBy);
  function show(message, persistent=false) {
    notice.textContent = message;
    notice.classList.add('show');
    if (!persistent) setTimeout(() => notice.classList.remove('show'), 3500);
  }
  function setLocalMap(map, reloadFrame) {
    applyingRemote = true;
    try {
      if (frameLoaded && frameStorageSetItem) frameStorageSetItem.call(frame.contentWindow.localStorage, KEY, JSON.stringify(map));
      else localStorage.setItem(KEY, JSON.stringify(map));
    } finally { applyingRemote = false; }
    lastKnownMap = {...map};
    if (reloadFrame && frameLoaded) {
      // Notify the embedded application without resetting its current view.
      try {
        frame.contentWindow.dispatchEvent(new StorageEvent('storage', {
          key: KEY,
          newValue: JSON.stringify(map),
          storageArea: frame.contentWindow.localStorage,
          url: frame.contentWindow.location.href
        }));
      } catch (error) { console.warn('Atualização visual adiada:', error); }
    }
  }
  async function writeState(id, state) {
    pendingWrites.add(id);
    try {
      await db.collection(COLLECTION).doc(cloudDocId(id)).set({
        boxId: id,
        status: stateValue(state).status,
        note: stateValue(state).note,
        checkedAt: stateValue(state).checkedAt,
        checkedBy: stateValue(state).checkedBy,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    } finally {
      pendingWrites.delete(id);
    }
  }
  async function handleLocalChange(serialized) {
    if (!ready || applyingRemote) return;
    let next;
    try { next = JSON.parse(serialized || '{}') || {}; } catch (_) { return; }
    const previous = lastKnownMap;
    const ids = new Set([...Object.keys(previous), ...Object.keys(next)]);
    lastKnownMap = {...next};
    const tasks = [];
    for (const id of ids) {
      if (JSON.stringify(stateValue(previous[id])) === JSON.stringify(stateValue(next[id]))) continue;
      // Don't create hundreds of cloud records just for default pending states.
      if (!previous[id] && !meaningful(next[id])) continue;
      tasks.push(writeState(id, next[id] || {status:'pendente'}));
    }
    if (tasks.length) {
      try { await Promise.all(tasks); show('Conferência salva e sincronizada.'); }
      catch (error) { console.error(error); show('Falha ao sincronizar. Confira a conexão e as regras do Firestore.'); }
    }
  }
  function patchFrameStorage() {
    try {
      const w = frame.contentWindow;
      if (!w || w.location.origin !== location.origin) return;
      frameStorageSetItem = w.Storage.prototype.setItem;
      // Save the Status view before the app opens a box in another tab.
      // Do not depend on a particular row selector: cards/buttons can change
      // their markup without breaking the return-to-Status behavior.
      const readStatusView = () => ({
        search: w.document.getElementById('statusSearch')?.value || '',
        filter: w.document.getElementById('statusFilter')?.value || 'todos',
        sort: w.document.getElementById('sortFilter')?.value || 'endereco'
      });
      const statusTabIsActive = () => {
        const activeNav = w.document.querySelector('.nav-link.active[data-page]');
        return !!activeNav && activeNav.dataset.page === 'status';
      };
      const rememberStatusView = () => {
        if (statusTabIsActive()) savedStatusView = readStatusView();
      };
      w.document.addEventListener('click', event => {
        const target = event.target;
        const navLink = target && target.closest
          ? target.closest('.nav-link[data-page]') : null;

        // Only a real user navigation cancels the saved context. The app may
        // navigate internally by calling .click(), which must not cancel it.
        if (navLink && event.isTrusted) {
          if (navLink.dataset.page === 'status') {
            returnToStatusAfterSave = false;
            savedStatusView = readStatusView();
          } else {
            returnToStatusAfterSave = false;
          }
          return;
        }

        // Any content interaction from the Status tab can open a box in the
        // conference screen. Capture the current search/filter/sort first.
        if (statusTabIsActive()) {
          savedStatusView = readStatusView();
          returnToStatusAfterSave = true;
        }
      }, true);
      ['input', 'change'].forEach(type => {
        w.document.addEventListener(type, event => {
          const target = event.target;
          if (target && ['statusSearch', 'statusFilter', 'sortFilter'].includes(target.id)) {
            rememberStatusView();
          }
        }, true);
      });
      w.Storage.prototype.setItem = function(key, value) {
        let before = null;
        if (key === KEY && !applyingRemote) {
          try { before = JSON.parse(this.getItem(key) || '{}') || {}; } catch (_) {}
        }
        frameStorageSetItem.call(this, key, value);
        if (key === KEY && !applyingRemote) {
          handleLocalChange(String(value));
          if (returnToStatusAfterSave) {
            let next = {};
            try { next = JSON.parse(String(value) || '{}') || {}; } catch (_) {}
            const changed = Object.keys(next).some(id =>
              JSON.stringify(next[id] || {}) !== JSON.stringify((before || {})[id] || {})
            );
            if (changed) {
              returnToStatusAfterSave = false;
              const view = savedStatusView;
              w.setTimeout(() => {
                const search = w.document.getElementById('statusSearch');
                const filter = w.document.getElementById('statusFilter');
                const sort = w.document.getElementById('sortFilter');
                if (search && view) search.value = view.search;
                if (filter && view) filter.value = view.filter;
                if (sort && view) sort.value = view.sort;
                const statusNav = w.document.querySelector('.nav-link[data-page="status"]');
                if (statusNav) statusNav.click();
                if (search) search.dispatchEvent(new w.Event('input', {bubbles:true}));
                if (filter) filter.dispatchEvent(new w.Event('change', {bubbles:true}));
                if (sort) sort.dispatchEvent(new w.Event('change', {bubbles:true}));
              }, 0);
            }
          }
        }
      };
      frameLoaded = true;
      // Keep the existing interface and change only its explanatory text.
      const walker = w.document.createTreeWalker(w.document.body, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.includes('O status fica salvo neste navegador.')) {
          node.nodeValue = node.nodeValue.replace('O status fica salvo neste navegador.', 'O status é sincronizado entre os dispositivos.');
        }
      }
      const local = readMap();
      if (ready) {
        const merged = {...local, ...lastKnownMap};
        if (!same(merged, local)) setLocalMap(merged, false);
        lastKnownMap = {...merged};
      } else {
        lastKnownMap = {...local};
      }
    } catch (error) { console.error('Não foi possível preparar a sincronização da tela:', error); }
  }
  frame.addEventListener('load', patchFrameStorage);
  async function start() {
    try {
      if (!firebase.apps.length) firebase.initializeApp(CONFIG);
      await firebase.auth().signInAnonymously();
      db = firebase.firestore();
      db.collection(COLLECTION).onSnapshot(async snapshot => {
        const remote = {};
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.boxId) remote[data.boxId] = stateValue(data);
        });
        const local = readMap();
        if (!firstSnapshot) {
          firstSnapshot = true;
          const merged = {...local, ...remote};
          lastKnownMap = {...merged};
          if (!same(merged, local)) setLocalMap(merged, true);
          ready = true;
          // One-time safe migration: write local non-default states only when the cloud record is absent.
          for (const [id,state] of Object.entries(local)) {
            if (!meaningful(state) || Object.prototype.hasOwnProperty.call(remote,id)) continue;
            try {
              const ref = db.collection(COLLECTION).doc(cloudDocId(id));
              await db.runTransaction(async tx => {
                const current = await tx.get(ref);
                if (!current.exists) tx.set(ref, {
                  boxId:id, ...stateValue(state),
                  updatedAt:firebase.firestore.FieldValue.serverTimestamp()
                });
              });
            } catch (error) { console.error('Falha na migração segura do status local:', id, error); }
          }
          show('Sincronização com a nuvem ativada.');
          return;
        }
        // Apply remote changes while preserving unsent local edits.
        const current = readMap();
        const merged = {...current};
        for (const [id,state] of Object.entries(remote)) {
          if (!pendingWrites.has(id)) merged[id] = state;
        }
        if (!same(merged, current)) {
          setLocalMap(merged, true);
          show('Dados atualizados de outro dispositivo.');
        }
      }, error => {
        console.error('Erro ao ler Firestore:', error);
        show('Sem sincronização: confira as regras do Firestore.', true);
      });
    } catch (error) {
      console.error('Falha ao iniciar Firebase:', error);
      show('Ative a autenticação anônima no Firebase e publique as regras do Firestore.', true);
    }
  }
  start();
})();
</script>
</body>
</html>
